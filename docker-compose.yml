services:
  clearotc-postgres:
    image: postgres:18-bookworm
    container_name: clearotc-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  clearotc-postgres-migrate:
    image: migrate/migrate:v4.19.1
    entrypoint: migrate
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forward:
    image: alpine/socat:1.8.1.3
    container_name: clearotc-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:clearotc-postgres:5432
    ports:
      - "127.0.0.1:5433:5432"
    depends_on:
      - clearotc-postgres